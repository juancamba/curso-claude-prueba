<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Únete — Kōhi</title></head>
<body><main>
<div class="card">
<div id="formBox">
<h2>Únete a la lista</h2><p class="lead">Reserva tu lugar en la apertura de Kōhi.</p>
<form id="f" novalidate>
<label for="name">Nombre</label><input id="name" autocomplete="name" required>
<label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
<label for="password">Contraseña</label><input id="password" type="password" autocomplete="new-password" required>
<label for="confirm">Confirmar contraseña</label><input id="confirm" type="password" autocomplete="new-password" required>
<button class="btn solid" id="btn">Registrarme</button>
<p class="msg" id="msg" role="alert"></p>
</form>
<p class="alt">¿Ya tienes cuenta? <a href="login.html">Entrar</a></p>
</div>
<div class="success hidden" id="ok"><h2>¡Estás en la lista!</h2><p class="pos" id="pos"></p><a class="btn solid" href="login.html">Iniciar sesión</a></div>
</div></main>
<script>
const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn');
const fail = t => { msg.className = 'msg error'; msg.textContent = t; };
f.addEventListener('submit', async e => {
  e.preventDefault(); msg.className = 'msg'; msg.textContent = '';
  const name = f.name.value.trim(), email = f.email.value.trim(), password = f.password.value;
  if (!name || !email || !password || !f.confirm.value) return fail('Completa todos los campos.');
  if (password !== f.confirm.value) return fail('Las contraseñas no coinciden.');
  btn.disabled = true;
  try {
    const r = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, password }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(r.status === 409 ? 'Ese email ya está registrado. Prueba a iniciar sesión.' : d.error || 'No se pudo completar el registro.');
    document.getElementById('formBox').classList.add('hidden');
    document.getElementById('ok').classList.remove('hidden');
    document.getElementById('pos').textContent = 'Tu posición: #' + d.position;
  } catch (err) {
    fail(err instanceof TypeError ? 'No hay conexión con el servidor.' : err.message);
  } finally { btn.disabled = false; }
});
</script></body></html>
