<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Entrar — Kōhi</title></head>
<body><main>
<div class="card">
<h2>Bienvenido de nuevo</h2><p class="lead">Consulta tu lugar en la lista.</p>
<form id="f" novalidate>
<label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
<label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required>
<button class="btn solid" id="btn">Entrar</button>
<p class="msg" id="msg" role="alert"></p>
</form>
<p class="alt">¿Aún no estás? <a href="register.html">Unirme a la lista</a></p>
</div></main>
<script>
const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn');
const fail = t => { msg.className = 'msg error'; msg.textContent = t; };
f.addEventListener('submit', async e => {
  e.preventDefault(); msg.className = 'msg'; msg.textContent = '';
  const email = f.email.value.trim(), password = f.password.value;
  if (!email || !password) return fail('Introduce email y contraseña.');
  btn.disabled = true;
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(r.status === 401 ? 'Email o contraseña incorrectos.' : d.error || 'No se pudo iniciar sesión.');
    localStorage.setItem('kohi_token', d.token);
    msg.className = 'msg ok'; msg.textContent = 'Entrando…';
    location.href = 'dashboard.html';
  } catch (err) {
    fail(err instanceof TypeError ? 'No hay conexión con el servidor.' : err.message);
    btn.disabled = false;
  }
});
</script></body></html>
